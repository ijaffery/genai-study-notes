<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title != site.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <script>
    // Theme: read saved preference or respect OS preference
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  <script>
    // Reading progress bar
    (function() {
      var bar = document.getElementById('progress-bar');
      function update() {
        var scrollTop = window.scrollY || document.documentElement.scrollTop;
        var docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        bar.style.width = Math.min(pct, 100) + '%';
      }
      window.addEventListener('scroll', update, { passive: true });
      update();
    })();
  </script>
  <script src="{{ site.baseurl }}/assets/js/exercises.js" defer></script>
</head>
<body>
  <div id="progress-bar"></div>
  <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">
    <span id="themeIcon">🌙</span>
  </button>
  <a href="{{ site.baseurl }}/{% if page.layout == 'page' %}{{ '/' }}{% else %}{{ '/' }}{% endif %}" id="logo">GenAI Notes</a>
  <div class="content">
    {{ content }}
  </div>
  <script>
    (function() {
      var btn = document.getElementById('themeToggle');
      var icon = document.getElementById('themeIcon');
      function updateIcon() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        icon.textContent = isDark ? '☀️' : '🌙';
      }
      updateIcon();
      btn.addEventListener('click', function() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
        }
        updateIcon();
      });
    })();
  </script>
</body>
</html>
